function log(msg, cls='info') {
  const el = document.getElementById('log');
  el.style.display='block';
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function startImport() {
  const btn = document.getElementById('importBtn');
  btn.disabled = true; btn.textContent = 'Importiere...';
  log('🚀 Starte Import von ' + DATA.length + ' Einträgen...');
  let ok=0, err=0;
  for (const row of DATA) {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/tageseintrag`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          Prefer: 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify(row)
      });
      if (r.ok || r.status===201 || r.status===204) {
        log(`✅ ${row.datum} (${row.gewicht ? row.gewicht+'kg' : 'kein Gewicht'})`, 'ok');
        ok++;
      } else {
        const txt = await r.text();
        log(`❌ ${row.datum}: ${txt}`, 'err'); err++;
      }
    } catch(e) {
      log(`❌ ${row.datum}: ${e.message}`, 'err'); err++;
    }
  }
  log(`\n✅ Import abgeschlossen: ${ok} erfolgreich, ${err} Fehler`, ok===DATA.length?'ok':'err');
  btn.textContent = 'Import abgeschlossen!';
}
</script>
</body>
</html>
